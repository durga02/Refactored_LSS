spring.application.name=LalithaSweets

server.port=${SERVER_PORT:8080}

# ==========================================
# DATABASE
# ==========================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# MAIL
# ==========================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

logging.level.root=INFO

# ==========================================
# WHATSAPP
# ==========================================
whatsapp.admin.number=${WHATSAPP_ADMIN_NUMBER:919177327911}
whatsapp.gateway.url=${WHATSAPP_GATEWAY_URL:http://localhost:3000/send}

# ==========================================
# SMS
# ==========================================
sms.api.url=${SMS_API_URL:}
sms.api.key=${SMS_API_KEY:}
sms.template.paymentConfirmed=${SMS_TEMPLATE_PAYMENT_CONFIRMED:}
sms.template.confirmed=${SMS_TEMPLATE_CONFIRMED:}
sms.template.preparing=${SMS_TEMPLATE_PREPARING:}
sms.template.packed=${SMS_TEMPLATE_PACKED:}
sms.template.shipped=${SMS_TEMPLATE_SHIPPED:}
sms.template.outForDelivery=${SMS_TEMPLATE_OUT_FOR_DELIVERY:}
sms.template.delivered=${SMS_TEMPLATE_DELIVERED:}
sms.template.cancelled=${SMS_TEMPLATE_CANCELLED:}

# ==========================================
# RAZORPAY
# ==========================================
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# ==========================================
# HikariCP Connection Pool
# ==========================================
spring.datasource.hikari.pool-name=LalithaHikariPool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.connection-test-query=SELECT 1

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.generate_statistics=false

# ==========================================
# Second Level Cache (disable for now)
# ==========================================
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

# ==========================================
# Management
# ==========================================
management.endpoints.web.exposure.exclude=env,heapdump

# ==========================================
# Application
# ==========================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.admin.default-username=${ADMIN_DEFAULT_USERNAME:admin}
app.admin.default-password=${ADMIN_DEFAULT_PASSWORD:}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}
app.backend.base-url=${BACKEND_BASE_URL:http://localhost:8080}
